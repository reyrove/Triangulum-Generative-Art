<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Triangulum</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    #canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }
    
    #canvas-wrapper canvas {
      display: block !important;
      max-width: 100%;
      max-height: 100%;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      border-radius: 2px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    
    #shirt-mockup {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      z-index: 2;
    }
    #shirt-mockup.active {
      display: block !important;
      animation: fadeIn 0.6s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
    
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.6);
      font-weight: 400;
    }
    
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      #canvas-wrapper canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, #canvas-wrapper canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>
<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <div class="title-bar">
    <div class="title"><span class="accent">Trian</span>gulum</div>
  </div>

  <div id="canvas-container">
    <div id="canvas-wrapper">
      <img id="shirt-mockup" src="Triangulum.jpg" alt="Triangulum on T-Shirt" />
    </div>
  </div>

  <div class="bottom-bar">

    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <div class="info-row">
      <div class="info-item">
        <span class="label">grid</span>
        <span class="value" id="gridDisplay">5×5</span>
      </div>
      <div class="info-item">
        <span class="label">arcs</span>
        <span class="value" id="arcsDisplay">17</span>
      </div>
    </div>

    <div class="description">
      <span class="highlight">triangulum</span>
      <span class="sep">·</span>
      <span class="highlight">5×5 grid</span>
      <span class="sep">·</span>
      <span class="highlight">17 arcs</span>
      <span class="sep">·</span>
      <span class="highlight">generative triangles</span>
    </div>

  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
// ============================================
// TRIANGULUM — ORIGINAL P5.JS ART
// ============================================

let p5Instance = null;
let showingShirt = false;
let arcColors = [];
let starColors = [];
let planetColors = [];
let frostParticles = [];
let planets = [];
let magicalTriangles = [];

const gridRows = 5; 
const gridCols = 5;
let canvasSize = 0;
let gridSpacingX = 0;
let gridSpacingY = 0;

// Random utility (replaces fxhash)
let seed = Math.random() * 2147483647;

function random() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
}

// ============================================
// P5.JS SETUP
// ============================================
function p5Setup(p) {
  const wrapper = document.getElementById('canvas-wrapper');
  const rect = wrapper.getBoundingClientRect();
  canvasSize = Math.min(rect.width, rect.height);
  
  p.createCanvas(canvasSize, canvasSize);
  
  const canvasEl = p.canvas;
  canvasEl.style.display = 'block';
  canvasEl.style.position = 'absolute';
  canvasEl.style.top = '50%';
  canvasEl.style.left = '50%';
  canvasEl.style.transform = 'translate(-50%, -50%)';
  canvasEl.style.zIndex = '1';
  canvasEl.style.maxWidth = '100%';
  canvasEl.style.maxHeight = '100%';
  canvasEl.style.width = 'auto';
  canvasEl.style.height = 'auto';

  p.noFill();
  p.angleMode(p.DEGREES);
  
  gridSpacingX = canvasSize / gridCols;
  gridSpacingY = canvasSize / gridRows;

  // Initialize colors
  arcColors = [];
  starColors = [];
  planetColors = [];
  frostParticles = [];
  planets = [];
  magicalTriangles = [];

  for (let i = 0; i < 5; i++) {
    arcColors.push(p.color(random() * 155 + random() * 100, random() * 100 + random() * 100, random() * 105 + random() * 150));
  }

  for (let i = 0; i < 5; i++) {
    starColors.push(p.color(random() * 55 + random() * 200, random() * 105 + random() * 150, random() * 55 + random() * 200));
  }

  for (let i = 0; i < 5; i++) {
    planetColors.push(p.color(random() * 105 + random() * 150, random() * 155 + random() * 100, random() * 105 + random() * 150, random() * 150));
  }

  for (let i = 0; i < gridRows; i++) {
    for (let j = 0; j < gridCols; j++) {
      frostParticles.push({
        x: j * gridSpacingX + gridSpacingX / 2,
        y: i * gridSpacingY + gridSpacingY / 2,
        size: random() * 3 * canvasSize / 400 + canvasSize / 200,
        alpha: random() * 100 + 50
      });
    }
  }

  for (let i = 0; i < gridRows; i++) {
    for (let j = 0; j < gridCols; j++) {
      planets.push({
        x: j * gridSpacingX + gridSpacingX / 2,
        y: i * gridSpacingY + gridSpacingY / 2,
        size: random() * canvasSize / 8 + canvasSize / 16,
        color: planetColors[(i + j) % planetColors.length]
      });
    }
  }

  for (let i = 0; i < gridRows; i++) {
    for (let j = 0; j < gridCols; j++) {
      magicalTriangles.push({
        x: j * gridSpacingX + gridSpacingX / 2,
        y: i * gridSpacingY + gridSpacingY / 2,
        size: random() * canvasSize / 20 + canvasSize / 40,
        color: starColors[(i + j) % starColors.length]
      });
    }
  }

  // Update info display
  document.getElementById('gridDisplay').textContent = `${gridCols}×${gridRows}`;
  document.getElementById('arcsDisplay').textContent = '17';
}

// ============================================
// P5.JS DRAW
// ============================================
function p5Draw(p) {
  p.background(random() * 16, random() * 24, random() * 32, random() * 30);
  p.translate(canvasSize / 2, canvasSize / 2);

  drawPlanets(p);
  drawFrostParticles(p);

  for (let i = 0; i < 17; i++) {
    let diameter = 16 * canvasSize / 100 + i * (canvasSize / 20);
    let startAngle = (i * 72) % 360;
    let endAngle = startAngle + 50;
    drawMagicalArcAsTriangle(p, diameter, startAngle, endAngle, i);
  }

  drawMagicalTriangles(p);
}

function drawMagicalArcAsTriangle(p, diameter, startAngle, endAngle, gradientIndex) {
  for (let i = 0; i < 32; i++) {
    let inter = p.map(i, 0, 31, 0, 1);
    let c = p.lerpColor(arcColors[(gradientIndex * 2) % arcColors.length], 
                      arcColors[(gradientIndex * 2 + 1) % arcColors.length], 
                      inter);
    p.stroke(c);
    p.strokeWeight(8 + p.sin(i * 2) * 4);

    let glowAlpha = p.map(i, 0, 31, 50, 200);
    p.strokeWeight(canvasSize / 25 - canvasSize * i / (25 * 32));
    p.stroke(c.levels[0], c.levels[1], c.levels[2], glowAlpha);

    let x1 = p.cos(startAngle + i) * diameter / 2;
    let y1 = p.sin(startAngle + i) * diameter / 2;
    let x2 = p.cos(endAngle + i) * diameter / 2;
    let y2 = p.sin(endAngle + i) * diameter / 2;
    let x3 = p.cos(startAngle + i + 45) * diameter / 2;
    let y3 = p.sin(startAngle + i + 45) * diameter / 2;
    p.triangle(x1, y1, x2, y2, x3, y3);
  }
}

function drawFrostParticles(p) {
  for (let particle of frostParticles) {
    p.fill(255, 255, 255, particle.alpha);
    p.noStroke();
    let x1 = particle.x - canvasSize / 2;
    let y1 = particle.y - canvasSize / 2 + particle.size / 2;
    let x2 = particle.x - canvasSize / 2 - particle.size / 2;
    let y2 = particle.y - canvasSize / 2 - particle.size / 2;
    let x3 = particle.x - canvasSize / 2 + particle.size / 2;
    let y3 = particle.y - canvasSize / 2 - particle.size / 2;
    p.triangle(x1, y1, x2, y2, x3, y3);
  }
}

function drawPlanets(p) {
  for (let planet of planets) {
    let pulsatingSize = planet.size;
    drawGlow(p, planet.x - canvasSize / 2, planet.y - canvasSize / 2, pulsatingSize, planet.color);
    
    let gradient = p.drawingContext.createRadialGradient(
      planet.x, planet.y, pulsatingSize * 0.1,
      planet.x, planet.y, pulsatingSize
    );
    gradient.addColorStop(0, p.color(255, 255, 255, 200));
    gradient.addColorStop(1, planet.color);

    p.drawingContext.fillStyle = gradient;

    let x1 = planet.x - canvasSize / 2;
    let y1 = planet.y - canvasSize / 2 + pulsatingSize / 2;
    let x2 = planet.x - canvasSize / 2 - pulsatingSize / 2;
    let y2 = planet.y - canvasSize / 2 - pulsatingSize / 2;
    let x3 = planet.x - canvasSize / 2 + pulsatingSize / 2;
    let y3 = planet.y - canvasSize / 2 - pulsatingSize / 2;
    p.triangle(x1, y1, x2, y2, x3, y3);
  }
}

function drawGlow(p, x, y, size, planetColor) {
  p.noFill();
  for (let i = 10; i > 0; i--) {
    p.stroke(planetColor.levels[0], planetColor.levels[1], planetColor.levels[2], canvasSize / 20 * i);
    
    let triangleSize = size + i * canvasSize / 40;
    
    let x1 = x;
    let y1 = y - triangleSize / 2;
    let x2 = x - triangleSize / 2;
    let y2 = y + triangleSize / 2;
    let x3 = x + triangleSize / 2;
    let y3 = y + triangleSize / 2;

    p.triangle(x1, y1, x2, y2, x3, y3);
  }
}

function drawMagicalTriangles(p) {
  for (let orb of magicalTriangles) {
    let gradient = p.drawingContext.createRadialGradient(
      orb.x, orb.y, orb.size * 0.1,
      orb.x, orb.y, orb.size
    );
    gradient.addColorStop(0, p.color(255, 255, 255, 200));
    gradient.addColorStop(1, orb.color);

    p.drawingContext.fillStyle = gradient;

    let x1 = orb.x - canvasSize / 2;
    let y1 = orb.y - canvasSize / 2 + orb.size / 2;
    let x2 = orb.x - canvasSize / 2 - orb.size / 2;
    let y2 = orb.y - canvasSize / 2 - orb.size / 2;
    let x3 = orb.x - canvasSize / 2 + orb.size / 2;
    let y3 = orb.y - canvasSize / 2 - orb.size / 2;
    p.triangle(x1, y1, x2, y2, x3, y3);
  }
}

// ============================================
// CREATE P5 INSTANCE
// ============================================
function createP5Instance() {
  if (p5Instance) {
    p5Instance.remove();
    p5Instance = null;
  }
  
  const sketch = function(p) {
    p.setup = function() {
      p5Setup(p);
    };
    
    p.draw = function() {
      p5Draw(p);
    };
  };
  
  p5Instance = new p5(sketch, 'canvas-wrapper');
}

// ============================================
// UI CONTROLS
// ============================================
function regenerate() {
  const shirtMockup = document.getElementById('shirt-mockup');
  shirtMockup.classList.remove('active');
  showingShirt = false;
  const shirtToggle = document.getElementById('shirtToggle');
  shirtToggle.classList.remove('active');
  shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  
  // Remove canvas
  const wrapper = document.getElementById('canvas-wrapper');
  const canvases = wrapper.getElementsByTagName('canvas');
  Array.from(canvases).forEach(c => c.remove());
  
  // Reset random seed
  seed = Math.random() * 2147483647;
  
  // Reset arrays
  arcColors = [];
  starColors = [];
  planetColors = [];
  frostParticles = [];
  planets = [];
  magicalTriangles = [];
  
  // Create new p5 instance
  createP5Instance();
}

function downloadCanvas() {
  if (showingShirt) {
    const link = document.createElement('a');
    link.download = 'Triangulum_Shirt.png';
    const img = document.getElementById('shirt-mockup');
    if (img && img.src) {
      link.href = img.src;
    }
    link.click();
    return;
  }
  
  const canvas = document.querySelector('#canvas-wrapper canvas');
  if (!canvas) return;
  const link = document.createElement('a');
  const hash = Date.now().toString(36) + Math.random().toString(36).substring(2, 6);
  link.download = 'Triangulum_' + hash + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function toggleShirt() {
  showingShirt = !showingShirt;
  const canvas = document.querySelector('#canvas-wrapper canvas');
  const shirtMockup = document.getElementById('shirt-mockup');
  const shirtToggle = document.getElementById('shirtToggle');
  
  if (showingShirt) {
    if (canvas) canvas.style.display = 'none';
    shirtMockup.classList.add('active');
    shirtToggle.classList.add('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    if (canvas) canvas.style.display = 'block';
    shirtMockup.classList.remove('active');
    shirtToggle.classList.remove('active');
    shirtToggle.innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// ============================================
// RESIZE HANDLER
// ============================================
let resizeTmr = null;

function handleResize() {
  clearTimeout(resizeTmr);
  resizeTmr = setTimeout(() => {
    regenerate();
  }, 300);
}

// ============================================
// INIT
// ============================================
function init() {
  createP5Instance();
  
  window.addEventListener('resize', handleResize);

  document.addEventListener('keydown', (e) => {
    if (e.key === 's' || e.key === 'S') {
      e.preventDefault();
      downloadCanvas();
    }
    if (e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      regenerate();
    }
    if (e.key === 't' || e.key === 'T') {
      e.preventDefault();
      toggleShirt();
    }
    if (e.key === ' ' || e.key === 'Space') {
      e.preventDefault();
      regenerate();
    }
  });

  document.getElementById('controlsBar').addEventListener('click', regenerate);
  document.getElementById('controlsBar').addEventListener('touchend', function(e) {
    e.preventDefault();
    regenerate();
  });

  document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
  document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
    e.preventDefault();
    toggleShirt();
  });
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

window.regenerate = regenerate;
window.saveImage = downloadCanvas;
window.toggleShirt = toggleShirt;
</script>
</body>
